<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="marca" role="img" aria-label="Grupo Vanguardia"></div>

        <div class="form-container" id="formContainer">
            <h1>Registro</h1>
            <p class="subtitulo" id="eventoActual" hidden></p>

            <p class="estado-carga" id="estadoCarga" role="status">Cargando…</p>

            <div class="aviso-cerrado" id="avisoCerrado" role="status" hidden>
                <h2>Registro cerrado</h2>
                <p id="avisoCerradoTexto"></p>
            </div>

            <form id="registroForm" hidden>
                <div class="form-group" id="grupoEvento" hidden>
                    <label for="eventoId">Evento</label>
                    <select id="eventoId" name="eventoId"></select>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="numEmpleado">Número de Empleado</label>
                    <input type="text" id="numEmpleado" name="numEmpleado" required>
                </div>

                <div class="form-group">
                    <label for="agencia">Agencia</label>
                    <select id="agencia" name="agencia" required></select>
                </div>

                <div class="form-group">
                    <label for="puesto">Puesto</label>
                    <input type="text" id="puesto" name="puesto" required>
                </div>

                <div class="form-group">
                    <label for="area">Área</label>
                    <select id="area" name="area" required></select>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <p class="error-form" id="errorForm" role="alert" hidden></p>

                <button type="submit" class="btn-submit" id="btnRegistrar">Registrar</button>
            </form>
        </div>

        <div class="confirmation-container" id="confirmationContainer" style="display: none;">
            <h1>¡Registro Exitoso!</h1>
            <div class="confirmation-card">
                <div class="ticket-info">
                    <h3>ID Ticket: <span id="ticketId"></span></h3>
                    <p><strong>Evento:</strong> <span id="confirmEvento"></span></p>
                    <p><strong>Fecha de Registro:</strong> <span id="fechaRegistro"></span></p>
                    <p><strong>Nombre:</strong> <span id="confirmNombre"></span></p>
                    <p><strong>Número de Empleado:</strong> <span id="confirmNumEmpleado"></span></p>
                    <p><strong>Agencia:</strong> <span id="confirmAgencia"></span></p>
                    <p><strong>Puesto:</strong> <span id="confirmPuesto"></span></p>
                    <p><strong>Área:</strong> <span id="confirmArea"></span></p>
                    <p><strong>Correo:</strong> <span id="confirmCorreo"></span></p>
                </div>

                <div class="qr-container">
                    <div id="qrCode"></div>
                    <button id="descargarQR" class="btn-download">Descargar QR</button>
                </div>
            </div>
            <button id="nuevoRegistro" class="btn-new">Nuevo Registro</button>
        </div>
    </main>

    <footer class="pie"><a href="registros.php">© 2026</a></footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
